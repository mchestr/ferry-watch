{{- if .Values.routes.dashboard.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ferry-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fw.labels" . | nindent 4 }}
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Home
    gethomepage.dev/name: Ferry Watch
    gethomepage.dev/icon: mdi-ferry
spec:
  hostnames: [{{ .Values.hosts.dashboard }}]
  parentRefs:
    {{- toYaml .Values.routes.dashboard.parentRefs | nindent 4 }}
  rules:
    - backendRefs:
        - {name: ferry-web, port: 8765}
{{- end }}

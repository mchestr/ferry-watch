{{- /* §7.9: no cookies or credentials reach vnc-edge or a browser pod; the ticket and the nonce are the auth. */ -}}
{{- if .Values.routes.checkout.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vnc-edge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fw.labels" . | nindent 4 }}
  annotations:
    gatus.home-operations.com/enabled: "false"
spec:
  hostnames: [{{ .Values.hosts.checkout }}]
  parentRefs:
    {{- toYaml .Values.routes.checkout.parentRefs | nindent 4 }}
  rules:
    - filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [Cookie, Authorization]
      backendRefs:
        - {name: vnc-edge, port: 8080}
{{- end }}

{{- /*
The admission policies' parameters (§7.5), from the same values as ferry-control's config, so the pod it
builds and the pod the cluster admits can't drift.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: ferry-browser-policy
  namespace: {{ .Values.browserNamespace }}
  labels:
    {{- include "fw.labels" . | nindent 4 }}
data:
  allowedImages: {{ include "fw.browserImages" . | quote }}
  hubUrl: {{ include "fw.hubUrl" . | quote }}
  vncPubkeys: {{ include "fw.pubkeys" . | quote }}
  vncOrigin: {{ include "fw.vncOrigin" . | quote }}
  podMemory: {{ .Values.pod.memory | quote }}
  cpuRequest: {{ .Values.pod.cpuRequest | quote }}
  maxDeadline: {{ .Values.pod.maxDeadlineSeconds | quote }}
  requireUserNamespace: {{ .Values.pod.requireUserNamespace | toString | quote }}
  sandbox: {{ .Values.pod.sandbox | toString | quote }}
  seccompProfile: {{ .Values.pod.seccompProfile | quote }}
  optionalEnv: ""
  controlSA: {{ include "fw.controlSA" . | quote }}
  breakGlassGroup: {{ .Values.admission.breakGlassGroup | quote }}

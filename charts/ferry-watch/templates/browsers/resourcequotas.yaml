{{- /* §7.7. One spare slot for a pod that's still terminating while its successor starts. */ -}}
{{- $slots := add1 .Values.fleet.maxBrowsersTotal -}}
{{- $podMi := include "fw.mebibytes" .Values.pod.memory | int -}}
{{- $budgetMi := include "fw.mebibytes" .Values.fleet.browserMemoryBudget | int -}}
{{- $memoryMi := mul $slots $podMi -}}
{{- if gt $memoryMi $budgetMi -}}
{{- fail (printf "%d browsers at %s need %dMi, more than fleet.browserMemoryBudget (%s)" $slots .Values.pod.memory $memoryMi .Values.fleet.browserMemoryBudget) -}}
{{- end -}}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: browsers
  namespace: {{ .Values.browserNamespace }}
  labels:
    {{- include "fw.labels" . | nindent 4 }}
spec:
  hard:
    pods: {{ $slots | quote }}
    requests.memory: {{ printf "%dMi" $memoryMi }}
    limits.memory: {{ printf "%dMi" $memoryMi }}
    requests.cpu: {{ printf "%dm" (mul $slots (include "fw.millicores" .Values.pod.cpuRequest | int)) }}
  scopeSelector:
    matchExpressions:
      - {scopeName: PriorityClass, operator: In, values: [ferry-browser]}
---
# Every pod must carry activeDeadlineSeconds.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: require-deadline
  namespace: {{ .Values.browserNamespace }}
  labels:
    {{- include "fw.labels" . | nindent 4 }}
spec:
  hard:
    pods: "0"
  scopes: [NotTerminating]
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: objects
  namespace: {{ .Values.browserNamespace }}
  labels:
    {{- include "fw.labels" . | nindent 4 }}
spec:
  hard:
    services: "1" # the headless `browsers`
    configmaps: "2" # the policy params and kube-root-ca.crt
    secrets: "0"
    count/poddisruptionbudgets.policy: "0"

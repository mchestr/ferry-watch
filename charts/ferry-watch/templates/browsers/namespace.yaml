{{- /* The browser pods' namespace (§7.2). Kept on uninstall: deleting it would take every running pod with it. */ -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.browserNamespace }}
  labels:
    {{- include "fw.labels" . | nindent 4 }}
    ferry-watch.io/browsers: "true"
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    helm.sh/resource-policy: keep
    kustomize.toolkit.fluxcd.io/prune: disabled

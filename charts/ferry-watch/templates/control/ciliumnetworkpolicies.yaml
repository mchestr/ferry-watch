{{- /*
§7.6: what plain NetworkPolicy can't say. Cross-node gateway traffic is SNATed to a node, which Cilium sees as
the kube-apiserver entity; ferry-control talks to the API server; ferry-web reaches a few public hosts by name.
*/ -}}
{{- if .Values.networkPolicies.enabled }}
{{- $np := .Values.networkPolicies -}}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ferry-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fw.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels: {app.kubernetes.io/name: ferry-web}
  ingress:
    - fromEntities: [kube-apiserver]
      toPorts:
        - ports: [{port: "8765", protocol: TCP}]
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports: [{port: "53", protocol: ANY}]
          rules:
            dns:
              - matchName: {{ trimSuffix "." .Values.database.host | quote }}
              {{- if .Values.smtp.enabled }}
              - matchName: {{ trimSuffix "." .Values.smtp.host | quote }}
              {{- end }}
              - matchName: {{ $np.issuerHost | quote }}
              {{- range $np.webEgressNames }}
              - {{ ternary "matchPattern" "matchName" (contains "*" .) }}: {{ . | quote }}
              {{- end }}
    - toFQDNs:
        {{- range $np.webEgressNames }}
        - {{ ternary "matchPattern" "matchName" (contains "*" .) }}: {{ . | quote }}
        {{- end }}
      toPorts:
        - ports: [{port: "443", protocol: TCP}]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ferry-control
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fw.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels: {app.kubernetes.io/name: ferry-control}
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports: [{port: "6443", protocol: TCP}]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vnc-edge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fw.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels: {app.kubernetes.io/name: vnc-edge}
  ingress:
    - fromEntities: [kube-apiserver]
      toPorts:
        - ports: [{port: "8080", protocol: TCP}]
{{- end }}

{{- /* §7.3: only ferry-control talks to the API server. */ -}}
{{- range $name, $token := dict "ferry-web" false "ferry-control" true "vnc-edge" false "ferry-migrate" false }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "fw.labels" $ | nindent 4 }}
automountServiceAccountToken: {{ $token }}
{{- end }}

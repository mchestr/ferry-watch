{{- /*
§7.6 for the release namespace. Default deny covers the chart's own pods only: the namespace also runs
home-cluster's pg-backups CronJob, which isn't the chart's to fence. Entity and FQDN rules are in
ciliumnetworkpolicies.yaml.
*/ -}}
{{- if .Values.networkPolicies.enabled }}
{{- $np := .Values.networkPolicies -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ferry-watch-default-deny
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fw.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/part-of: ferry-watch}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ferry-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fw.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: ferry-web}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- include "fw.peer" $np.gateway | nindent 8 }}
      ports:
        - {protocol: TCP, port: 8765}
  egress:
    - to:
        {{- include "fw.peer" $np.database | nindent 8 }}
      ports:
        - {protocol: TCP, port: {{ .Values.database.port }}}
    {{- if .Values.smtp.enabled }}
    - to:
        {{- include "fw.peer" $np.smtp | nindent 8 }}
      ports:
        - {protocol: TCP, port: {{ .Values.smtp.port }}}
    {{- end }}
    # The OIDC issuer resolves to the gateway; the policy sees its Envoy pods, on the shifted port (§6.2.2).
    - to:
        {{- include "fw.peer" $np.gateway | nindent 8 }}
      ports:
        - {protocol: TCP, port: {{ $np.issuerPort }}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ferry-control
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fw.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: ferry-control}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Values.browserNamespace }}}
          podSelector:
            matchLabels: {app.kubernetes.io/name: ferry-browser}
      ports:
        - {protocol: TCP, port: 8766}
  egress:
    - to:
        {{- include "fw.peer" $np.database | nindent 8 }}
      ports:
        - {protocol: TCP, port: {{ .Values.database.port }}}
    {{- include "fw.dnsPeer" . | nindent 4 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vnc-edge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fw.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: vnc-edge}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- include "fw.peer" $np.gateway | nindent 8 }}
      ports:
        - {protocol: TCP, port: 8080}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Values.browserNamespace }}}
          podSelector:
            matchLabels: {app.kubernetes.io/name: ferry-browser}
      ports:
        - {protocol: TCP, port: 6080}
    {{- include "fw.dnsPeer" . | nindent 4 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ferry-db-jobs
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fw.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [ferry-db-init, ferry-db-migrate]}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        {{- include "fw.peer" $np.database | nindent 8 }}
      ports:
        - {protocol: TCP, port: {{ .Values.database.port }}}
    {{- include "fw.dnsPeer" . | nindent 4 }}
{{- end }}

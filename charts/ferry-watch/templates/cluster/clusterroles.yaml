{{- /* ferry-control's only cluster-wide verbs (§7.3): TokenReview, to know which pod is calling, and reading nodes. */ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ferry-watch-control-tokenreview
  labels:
    {{- include "fw.labels" . | nindent 4 }}
rules:
  - {apiGroups: [authentication.k8s.io], resources: [tokenreviews], verbs: [create]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ferry-watch-control-tokenreview
  labels:
    {{- include "fw.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: ferry-watch-control-tokenreview}
subjects:
  - {kind: ServiceAccount, name: ferry-control, namespace: {{ .Release.Namespace }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ferry-watch-control-nodes
  labels:
    {{- include "fw.labels" . | nindent 4 }}
rules:
  - {apiGroups: [""], resources: [nodes], verbs: [get, list, watch]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ferry-watch-control-nodes
  labels:
    {{- include "fw.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: ferry-watch-control-nodes}
subjects:
  - {kind: ServiceAccount, name: ferry-control, namespace: {{ .Release.Namespace }}}

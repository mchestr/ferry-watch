{{- /*
fw-ns-objects (§7.5, M2): defence in depth behind RBAC. No ferry service account may write any of these in
either ferry namespace, or create a pod in the release namespace, whatever a RoleBinding someday says.
*/ -}}
{{- if .Values.admission.nsObjects }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: fw-ns-objects
  labels:
    {{- include "fw.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [{{ .Release.Namespace }}, {{ .Values.browserNamespace }}]
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [secrets, configmaps, services, endpoints, serviceaccounts, resourcequotas, limitranges]
      - apiGroups: [discovery.k8s.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [endpointslices]
      - apiGroups: [networking.k8s.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [networkpolicies]
      - apiGroups: [cilium.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [ciliumnetworkpolicies]
      - apiGroups: [rbac.authorization.k8s.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [roles, rolebindings]
      - apiGroups: [gateway.networking.k8s.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [httproutes]
      - apiGroups: [gateway.envoyproxy.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [securitypolicies]
      - apiGroups: [external-secrets.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [externalsecrets, pushsecrets]
      - apiGroups: [policy]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [poddisruptionbudgets]
      - apiGroups: [apps]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [deployments, replicasets, statefulsets, daemonsets]
      - apiGroups: [batch]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [jobs, cronjobs]
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: [CREATE]
        resources: [pods]
  validations:
    - expression: >-
        !(request.userInfo.username.startsWith('system:serviceaccount:{{ .Release.Namespace }}:') ||
          request.userInfo.username.startsWith('system:serviceaccount:{{ .Values.browserNamespace }}:')) ||
        (request.resource.resource == 'pods' && request.namespace == '{{ .Values.browserNamespace }}')
      message: Ferry Watch's service accounts can't change objects in its namespaces.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: fw-ns-objects
  labels:
    {{- include "fw.labels" . | nindent 4 }}
spec:
  policyName: fw-ns-objects
  validationActions: [Deny]
{{- end }}

{{- /* §7.7: browsers never preempt the owner's workloads, and default-priority pods can't preempt a holding browser. */ -}}
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: ferry-browser
  labels:
    {{- include "fw.labels" . | nindent 4 }}
value: 0
preemptionPolicy: Never
globalDefault: false
description: Ferry Watch browser pods.

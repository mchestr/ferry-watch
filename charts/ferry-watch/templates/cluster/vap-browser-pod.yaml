{{- /*
fw-browser-pod (§7.5): the only pod the browser namespace admits is the one ferry-control builds
(src/ferry_watch/control/pods.py), created by ferry-control (or a break-glass person). Every field is fixed or
equals a parameter from ferry-browser-policy. tests/apiserver/ proves both directions against a real API
server: what pods.py renders is admitted, and each change to it is denied.
*/ -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: fw-browser-pod
  labels:
    {{- include "fw.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  paramKind: {apiVersion: v1, kind: ConfigMap}
  matchConstraints:
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: {{ .Values.browserNamespace }}}
    resourceRules:
      - {apiGroups: [""], apiVersions: [v1], operations: [CREATE], resources: [pods]}
  variables:
    - name: p
      expression: params.data
    - name: name
      expression: object.metadata.name
    - name: labels
      expression: object.metadata.labels
    - name: spec
      expression: object.spec
    - name: c
      expression: object.spec.containers[0]
    - name: env
      expression: variables.c.env
    - name: optionalEnv
      # A params change can admit one of these, never anything else (§5.7).
      expression: "variables.p.optionalEnv.split(',').filter(n, n in ['FW_CHECKOUT_MODE'])"
    - name: sc
      expression: variables.c.securityContext
  validations:
    # ---- who
    - expression: >-
        request.userInfo.username == variables.p.controlSA ||
        variables.p.breakGlassGroup in request.userInfo.groups
      message: Only ferry-control creates browser pods.

    # ---- metadata
    - expression: "variables.name.matches('^fw-[a-f0-9]{16}-g[1-9][0-9]{0,5}$')"
      message: The name must be fw-<trip>-g<gen>.
    - expression: >-
        has(object.metadata.labels) && variables.labels.size() == 7 &&
        variables.labels['app.kubernetes.io/name'] == 'ferry-browser' &&
        variables.labels['app.kubernetes.io/managed-by'] == 'ferry-watch-control' &&
        variables.labels['ferry-watch.io/trip'] == variables.name.substring(3, 19) &&
        variables.labels['ferry-watch.io/pod'] == variables.name &&
        variables.labels['ferry-watch.io/gen'] == variables.name.substring(21) &&
        variables.labels['ferry-watch.io/owner'].matches('^[a-z0-9]{20}$') &&
        variables.labels['ferry-watch.io/egress'] == 'allowlist'
      message: The labels must be exactly the seven derived from the pod's name and owner, with egress=allowlist.
    - expression: >-
        !has(object.metadata.annotations) ||
        object.metadata.annotations.all(k, k in ['fluentbit.io/exclude', 'kubernetes.io/egress-bandwidth'])
      message: Only the log-exclusion and egress-bandwidth annotations are allowed.
    - expression: >-
        (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences.size() == 0) &&
        (!has(object.metadata.finalizers) || object.metadata.finalizers.size() == 0)
      message: Browser pods are bare, with no owners or finalizers.

    # ---- the pod
    - expression: >-
        variables.spec.serviceAccountName == 'ferry-browser' &&
        has(variables.spec.automountServiceAccountToken) && !variables.spec.automountServiceAccountToken &&
        has(variables.spec.enableServiceLinks) && !variables.spec.enableServiceLinks &&
        variables.spec.restartPolicy == 'Never' &&
        has(variables.spec.hostname) && variables.spec.hostname == variables.name &&
        has(variables.spec.subdomain) && variables.spec.subdomain == 'browsers' &&
        variables.spec.priorityClassName == 'ferry-browser' &&
        variables.spec.dnsPolicy == 'ClusterFirst' &&
        has(variables.spec.activeDeadlineSeconds) && variables.spec.activeDeadlineSeconds > 0 &&
        variables.spec.activeDeadlineSeconds <= int(variables.p.maxDeadline) &&
        variables.spec.terminationGracePeriodSeconds == 90
      message: The pod's fixed fields (service account, no token, hostname, priority, deadline, grace) don't match.
    - expression: >-
        variables.p.requireUserNamespace != 'true' ||
        (has(variables.spec.hostUsers) && !variables.spec.hostUsers)
      message: The pod must run in its own user namespace (hostUsers false).
    - expression: >-
        has(variables.spec.securityContext) &&
        variables.spec.securityContext.runAsNonRoot == true &&
        variables.spec.securityContext.runAsUser == 1001 &&
        variables.spec.securityContext.runAsGroup == 1001 &&
        (variables.p.sandbox == 'true'
          ? variables.spec.securityContext.seccompProfile.type == 'Localhost' &&
            variables.spec.securityContext.seccompProfile.localhostProfile == variables.p.seccompProfile
          : variables.spec.securityContext.seccompProfile.type == 'RuntimeDefault') &&
        !has(variables.spec.securityContext.sysctls) &&
        !has(variables.spec.securityContext.seLinuxOptions) &&
        !has(variables.spec.securityContext.windowsOptions) &&
        !has(variables.spec.securityContext.supplementalGroups) &&
        !has(variables.spec.securityContext.fsGroup)
      message: The pod's security context must be uid 1001 with the expected seccomp profile, and nothing more.
    - expression: >-
        !has(variables.spec.hostAliases) && !has(variables.spec.dnsConfig) && !has(variables.spec.nodeName) &&
        !has(variables.spec.nodeSelector) && !has(variables.spec.affinity) && !has(variables.spec.runtimeClassName) &&
        !has(variables.spec.shareProcessNamespace) && !has(variables.spec.resourceClaims) &&
        !has(variables.spec.overhead) && !has(variables.spec.schedulingGates) &&
        !has(variables.spec.initContainers) && !has(variables.spec.ephemeralContainers) &&
        !has(variables.spec.readinessGates) && !has(variables.spec.topologySpreadConstraints) &&
        !has(variables.spec.imagePullSecrets) && !has(variables.spec.resources) &&
        !(has(variables.spec.hostNetwork) && variables.spec.hostNetwork) &&
        !(has(variables.spec.hostPID) && variables.spec.hostPID) &&
        !(has(variables.spec.hostIPC) && variables.spec.hostIPC)
      message: The pod sets a field browser pods never use (placement, host namespaces, extra containers, ...).
    - expression: >-
        has(variables.spec.tolerations) && variables.spec.tolerations.size() == 2 &&
        variables.spec.tolerations.all(t,
          t.key in ['node.kubernetes.io/not-ready', 'node.kubernetes.io/unreachable'] &&
          t.operator == 'Exists' && t.effect == 'NoExecute' && t.tolerationSeconds == 60) &&
        variables.spec.tolerations[0].key != variables.spec.tolerations[1].key
      message: The tolerations must be exactly not-ready and unreachable for 60 seconds.

    # ---- the one container
    - expression: >-
        variables.spec.containers.size() == 1 && variables.c.name == 'browser' &&
        variables.c.image.contains('@sha256:') && variables.c.image in variables.p.allowedImages.split(',')
      message: One container, named browser, running an allowed image by digest.
    - expression: >-
        !has(variables.c.command) && !has(variables.c.args) && !has(variables.c.workingDir) &&
        !has(variables.c.lifecycle) && !has(variables.c.envFrom) && !has(variables.c.volumeDevices) &&
        !has(variables.c.restartPolicy) &&
        !(has(variables.c.stdin) && variables.c.stdin) && !(has(variables.c.tty) && variables.c.tty)
      message: The container can't set a command, arguments, hooks or other inputs.
    - expression: >-
        has(variables.c.env) && variables.env.all(e, !has(e.valueFrom) && has(e.value)) &&
        variables.env.all(e, variables.env.exists_one(f, f.name == e.name)) &&
        variables.env.all(e, e.name in ['FW_TRIP_ID', 'FW_OWNER', 'FW_POD_NAME', 'FW_DEADLINE_AT', 'FW_HUB_URL',
          'FW_VNC_PUBKEYS', 'FW_VNC_ORIGIN', 'FW_SANDBOX'] ||
          (e.name in variables.optionalEnv && e.value.matches('^[a-z_]{1,16}$'))) &&
        variables.env.exists(e, e.name == 'FW_TRIP_ID' && e.value == variables.labels['ferry-watch.io/trip']) &&
        variables.env.exists(e, e.name == 'FW_OWNER' && e.value == variables.labels['ferry-watch.io/owner']) &&
        variables.env.exists(e, e.name == 'FW_POD_NAME' && e.value == variables.name) &&
        variables.env.exists(e, e.name == 'FW_DEADLINE_AT' && e.value.matches('^[0-9]{10}$')) &&
        variables.env.exists(e, e.name == 'FW_HUB_URL' && e.value == variables.p.hubUrl) &&
        variables.env.exists(e, e.name == 'FW_VNC_PUBKEYS' && e.value == variables.p.vncPubkeys) &&
        variables.env.exists(e, e.name == 'FW_VNC_ORIGIN' && e.value == variables.p.vncOrigin) &&
        variables.env.exists(e, e.name == 'FW_SANDBOX' && e.value == (variables.p.sandbox == 'true' ? '1' : '0'))
      message: The environment must be exactly the eight literal values, matching the pod and the parameters.
    - expression: >-
        has(variables.c.ports) && variables.c.ports.size() == 2 &&
        variables.c.ports.exists(q, q.name == 'vnc' && q.containerPort == 6080) &&
        variables.c.ports.exists(q, q.name == 'probe' && q.containerPort == 8080) &&
        variables.c.ports.all(q, q.protocol == 'TCP' && !has(q.hostPort) && !has(q.hostIP))
      message: The ports must be vnc 6080 and probe 8080, with no host ports.
    - expression: >-
        has(variables.c.startupProbe) && has(variables.c.livenessProbe) && has(variables.c.readinessProbe) &&
        [variables.c.startupProbe, variables.c.livenessProbe, variables.c.readinessProbe].all(probe,
          has(probe.httpGet) && string(probe.httpGet.port) == 'probe' && !has(probe.httpGet.host) &&
          !has(probe.httpGet.httpHeaders) && probe.httpGet.path in ['/livez', '/readyz'])
      message: Each probe is an HTTP GET of /livez or /readyz on the probe port.
    - expression: >-
        has(variables.c.resources.requests) && has(variables.c.resources.limits) &&
        variables.c.resources.requests.size() == 3 && variables.c.resources.limits.size() == 3 &&
        quantity(variables.c.resources.requests['cpu']).compareTo(quantity(variables.p.cpuRequest)) == 0 &&
        quantity(variables.c.resources.requests['memory']).compareTo(quantity(variables.p.podMemory)) == 0 &&
        quantity(variables.c.resources.requests['ephemeral-storage']).compareTo(quantity('64Mi')) == 0 &&
        quantity(variables.c.resources.limits['cpu']).compareTo(quantity('1500m')) == 0 &&
        quantity(variables.c.resources.limits['memory']).compareTo(quantity(variables.p.podMemory)) == 0 &&
        quantity(variables.c.resources.limits['ephemeral-storage']).compareTo(quantity('256Mi')) == 0
      message: The resources must be the fleet's, memory request equal to its limit.
    - expression: >-
        has(variables.c.securityContext) &&
        has(variables.sc.allowPrivilegeEscalation) && !variables.sc.allowPrivilegeEscalation &&
        has(variables.sc.readOnlyRootFilesystem) && variables.sc.readOnlyRootFilesystem &&
        has(variables.sc.capabilities) && has(variables.sc.capabilities.drop) &&
        variables.sc.capabilities.drop == ['ALL'] && !has(variables.sc.capabilities.add) &&
        !has(variables.sc.privileged) && !has(variables.sc.runAsUser) && !has(variables.sc.runAsGroup) &&
        !has(variables.sc.runAsNonRoot) && !has(variables.sc.procMount) && !has(variables.sc.seLinuxOptions) &&
        !has(variables.sc.seccompProfile) && !has(variables.sc.windowsOptions)
      message: The container must drop every capability, keep its root read-only, and override nothing.
    - expression: >-
        variables.c.terminationMessagePolicy == 'File' &&
        variables.c.terminationMessagePath == '/dev/termination-log'
      message: The termination message comes from /dev/termination-log only.
    - expression: >-
        has(variables.c.volumeMounts) && variables.c.volumeMounts.size() == 3 &&
        variables.c.volumeMounts.all(m, !has(m.subPath) && !has(m.subPathExpr) && !has(m.mountPropagation)) &&
        variables.c.volumeMounts.exists(m, m.name == 'tmp' && m.mountPath == '/tmp') &&
        variables.c.volumeMounts.exists(m, m.name == 'shm' && m.mountPath == '/dev/shm') &&
        variables.c.volumeMounts.exists(m, m.name == 'hub-token' && m.mountPath == '/var/run/fw' &&
          has(m.readOnly) && m.readOnly)
      message: The mounts must be /tmp, /dev/shm and the hub token, read-only, with no sub-paths.
    - expression: >-
        has(variables.spec.volumes) && variables.spec.volumes.size() == 3 &&
        variables.spec.volumes.exists(v, v.name == 'tmp' && has(v.emptyDir) && v.emptyDir.medium == 'Memory' &&
          quantity(v.emptyDir.sizeLimit).compareTo(quantity('512Mi')) == 0) &&
        variables.spec.volumes.exists(v, v.name == 'shm' && has(v.emptyDir) && v.emptyDir.medium == 'Memory' &&
          quantity(v.emptyDir.sizeLimit).compareTo(quantity('256Mi')) == 0) &&
        variables.spec.volumes.exists(v, v.name == 'hub-token' && has(v.projected) &&
          v.projected.sources.size() == 1 && has(v.projected.sources[0].serviceAccountToken) &&
          v.projected.sources[0].serviceAccountToken.audience == 'ferry-watch-agent' &&
          v.projected.sources[0].serviceAccountToken.expirationSeconds <= 600 &&
          v.projected.sources[0].serviceAccountToken.path == 'token')
      message: The volumes must be the two memory scratch dirs and the hub token (audience ferry-watch-agent, at most 10 minutes).
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: fw-browser-pod
  labels:
    {{- include "fw.labels" . | nindent 4 }}
spec:
  policyName: fw-browser-pod
  validationActions: [Deny]
  paramRef:
    name: ferry-browser-policy
    namespace: {{ .Values.browserNamespace }}
    parameterNotFoundAction: Deny
  matchResources:
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: {{ .Values.browserNamespace }}}

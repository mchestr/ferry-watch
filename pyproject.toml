[project]
name = "ferry-watch"
version = "0.6.3"
description = "Watch BC Ferries for open reservations, alert via Pushover, and hold the sailing in a cart"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiohttp==3.10.10",
  "msgspec==0.22.0",
  "cryptography==50.0.1",
]

[project.optional-dependencies]
# What drives a browser: the browser pod's agent and today's single-container app. The control plane
# (ferry-control, ferry-web) installs without it, so its images carry no Playwright or Chromium.
browser = [
  # Must match the browsers in the mcr.microsoft.com/playwright/python base image.
  "playwright==1.56.0",
  "selectolax==0.3.21",
]
# What the control plane (ferry-control, ferry-web) needs beyond the core: Postgres.
control = [
  "asyncpg==0.31.0",
  "PyJWT==2.15.1",  # ferry-web's OIDC id_token checks
]

[project.scripts]
ferry-watch = "ferry_watch.__main__:main"
ferry-watch-agent = "ferry_watch.agent.main:main"
ferry-control = "ferry_watch.control.main:main"
ferry-web = "ferry_watch.web.main:main"

[dependency-groups]
dev = [
  "ferry-watch[browser,control]",
  "asyncpg-stubs==0.31.3",
  "import-linter==2.15",
  "mypy==1.13.0",
  "pytest==8.3.3",
  "pytest-aiohttp==1.0.5",
  "pytest-asyncio==0.24.0",
  "pytest-cov==6.0.0",
  "pytest-socket==0.7.0",
  "pytest-timeout==2.3.1",
  "ruff==0.7.1",
  "pyyaml==6.0.2",
]

[build-system]
requires = ["hatchling==1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ferry_watch"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "PIE", "PT", "RET", "SIM", "TID", "ARG", "PTH",
  "PL", "TRY", "BLE", "S", "LOG", "G", "ASYNC", "PERF", "FURB", "RUF", "C90",
]
ignore = [
  "TRY003",   # long messages in exception constructors are fine for user-facing validation errors
  "PLR0913",  # a few constructors legitimately take many collaborators
  "PLR2004",  # magic numbers read fine in this domain (passenger counts, feet, HTTP statuses)
  "N818",     # exception names describe what happened (LoginFailed, SessionExpired); an Error suffix adds nothing
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"urllib.request".msg = "Use the shared aiohttp ClientSession"
"playwright.sync_api".msg = "Use the async Playwright API"
"time.sleep".msg = "Use asyncio.sleep"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "ARG001", "PLR2004"]  # asserts, fake secrets, pod paths, fixture args

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
files = ["src", "tests", "vnc-edge/build.py"]
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool", "possibly-undefined"]

[[tool.mypy.overrides]]
module = ["selectolax.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests may only talk to servers they start themselves: never bcferries.com or Pushover.
addopts = ["-ra", "--strict-markers", "--strict-config", "--allow-hosts=127.0.0.1,::1", "--allow-unix-socket"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 60
markers = [
  "browser: drives Chromium against saved copies of BC Ferries' pages (never the live site)",
  "apiserver: the deployment's admission policies and RBAC on a real kube-apiserver (envtest binaries, helm)",
]
filterwarnings = ["error"]

# Module boundaries (docs/multi-tenant/design-reference.md §11): checked in CI with `lint-imports`.
[tool.importlinter]
root_package = "ferry_watch"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The shared core never drives a browser"
type = "forbidden"
source_modules = [
  "ferry_watch.protocol",
  "ferry_watch.polling",
  "ferry_watch.holds",
  "ferry_watch.tickets",
  "ferry_watch.models",
  "ferry_watch.bcferries.urls",
  "ferry_watch.bcferries.terminals",
  "ferry_watch.bcferries.errors",
]
forbidden_modules = [
  "playwright",
  "selectolax",
  "ferry_watch.bcferries.site",
  "ferry_watch.bcferries.parse",
  "ferry_watch.agent",
]

[[tool.importlinter.contracts]]
name = "The agent doesn't use the single-container app"
type = "forbidden"
source_modules = ["ferry_watch.agent"]
forbidden_modules = [
  "ferry_watch.server",
  "ferry_watch.watcher",
  "ferry_watch.store",
  "ferry_watch.notify",
  "ferry_watch.views",
  "ferry_watch.settings",
  "ferry_watch.__main__",
]

[[tool.importlinter.contracts]]
name = "The control plane never drives a browser"
type = "forbidden"
source_modules = ["ferry_watch.control"]
forbidden_modules = [
  "playwright",
  "selectolax",
  "ferry_watch.bcferries.site",
  "ferry_watch.bcferries.parse",
  "ferry_watch.agent",
  "ferry_watch.server",
  "ferry_watch.watcher",
]

[[tool.importlinter.contracts]]
name = "The agent never imports the control plane"
type = "forbidden"
source_modules = ["ferry_watch.agent"]
forbidden_modules = ["ferry_watch.control", "asyncpg"]

[[tool.importlinter.contracts]]
name = "ferry-web has no Kubernetes access and never drives a browser"
type = "forbidden"
source_modules = ["ferry_watch.web"]
forbidden_modules = [
  "ferry_watch.control.kube",
  "ferry_watch.control.fleet",
  "ferry_watch.control.hub",
  "ferry_watch.agent",
  "ferry_watch.bcferries.site",
  "ferry_watch.bcferries.parse",
  "playwright",
  "selectolax",
]

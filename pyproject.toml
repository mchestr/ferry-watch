[project]
name = "waitlist"
version = "1.0.0"
description = "Watch reservation systems for openings on what is booked up, and alert when one opens (BC Ferries first)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiohttp==3.10.10",
  "msgspec==0.22.0",
  "cryptography==50.0.1",
]

[project.optional-dependencies]
# What drives a browser: the browser pod's agent. The control plane (waitlist-control, waitlist-web) installs
# without it, so its image carries no Playwright or Chromium.
browser = [
  # Must match the browsers in the mcr.microsoft.com/playwright/python base image.
  "playwright==1.56.0",
  "selectolax==0.3.21",
]
# What the control plane (waitlist-control, waitlist-web) needs beyond the core: Postgres.
control = [
  "asyncpg==0.31.0",
  "PyJWT==2.15.1",  # waitlist-web's OIDC id_token checks
]

[project.scripts]
waitlist-agent = "waitlist.agent.main:main"
waitlist-control = "waitlist.control.main:main"
waitlist-web = "waitlist.web.main:main"
waitlist-fetcher = "waitlist.fetcher.main:main"

[dependency-groups]
dev = [
  "waitlist[browser,control]",
  "asyncpg-stubs==0.31.3",
  "import-linter==2.15",
  "mypy==1.13.0",
  "pytest==8.3.3",
  "pytest-aiohttp==1.0.5",
  "pytest-asyncio==0.24.0",
  "pytest-cov==6.0.0",
  "pytest-socket==0.7.0",
  "pytest-timeout==2.3.1",
  "ruff==0.7.1",
]

[build-system]
requires = ["hatchling==1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/waitlist"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "PIE", "PT", "RET", "SIM", "TID", "ARG", "PTH",
  "PL", "TRY", "BLE", "S", "LOG", "G", "ASYNC", "PERF", "FURB", "RUF", "C90",
]
ignore = [
  "TRY003",   # long messages in exception constructors are fine for user-facing validation errors
  "PLR0913",  # a few constructors legitimately take many collaborators
  "PLR2004",  # magic numbers read fine in this domain (passenger counts, feet, HTTP statuses)
  "N818",     # exception names describe what happened (LoginFailed, SessionExpired); an Error suffix adds nothing
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"urllib.request".msg = "Use the shared aiohttp ClientSession"
"playwright.sync_api".msg = "Use the async Playwright API"
"time.sleep".msg = "Use asyncio.sleep"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "ARG001", "PLR2004"]  # asserts, fake secrets, pod paths, fixture args

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
files = ["src", "tests", "vnc-edge/build.py"]
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool", "possibly-undefined"]

[[tool.mypy.overrides]]
module = ["selectolax.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests may only talk to servers they start themselves: never bcferries.com or a push service.
addopts = ["-ra", "--strict-markers", "--strict-config", "--allow-hosts=127.0.0.1,::1", "--allow-unix-socket"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 60
markers = [
  "browser: drives Chromium against saved copies of BC Ferries' pages (never the live site)",
]
filterwarnings = ["error"]

# Module boundaries (docs/multi-tenant/design-reference.md §11): checked in CI with `lint-imports`.
[tool.importlinter]
root_package = "waitlist"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The shared core never drives a browser"
type = "forbidden"
source_modules = [
  "waitlist.protocol",
  "waitlist.polling",
  "waitlist.holds",
  "waitlist.tickets",
  "waitlist.models",
  "waitlist.versions",
  "waitlist.fetchwire",
  "waitlist.bcferries.urls",
  "waitlist.bcferries.terminals",
  "waitlist.bcferries.errors",
]
forbidden_modules = [
  "playwright",
  "selectolax",
  "waitlist.bcferries.site",
  "waitlist.bcferries.parse",
  "waitlist.agent",
]

[[tool.importlinter.contracts]]
name = "The control plane never drives a browser"
type = "forbidden"
source_modules = ["waitlist.control"]
forbidden_modules = [
  "playwright",
  "selectolax",
  "waitlist.bcferries.site",
  "waitlist.bcferries.parse",
  "waitlist.agent",
]

[[tool.importlinter.contracts]]
name = "The agent never imports the control plane"
type = "forbidden"
source_modules = ["waitlist.agent"]
forbidden_modules = ["waitlist.control", "asyncpg"]

[[tool.importlinter.contracts]]
name = "waitlist-web has no Kubernetes access and never drives a browser"
type = "forbidden"
source_modules = ["waitlist.web"]
forbidden_modules = [
  "waitlist.control.kube",
  "waitlist.control.fleet",
  "waitlist.control.hub",
  "waitlist.agent",
  "waitlist.bcferries.site",
  "waitlist.bcferries.parse",
  "playwright",
  "selectolax",
]

[[tool.importlinter.contracts]]
name = "Providers are pure: no I/O, no database, no app, no browser"
type = "forbidden"
source_modules = ["waitlist.providers"]
forbidden_modules = [
  "aiohttp",
  "asyncpg",
  "playwright",
  "selectolax",
  "waitlist.agent",
  "waitlist.control",
  "waitlist.web",
  "waitlist.fetcher",
  "waitlist.fetchwire",
  "waitlist.bcferries.site",
  "waitlist.bcferries.parse",
]

[[tool.importlinter.contracts]]
name = "Only waitlist-fetcher runs a provider's client (it parses what a site sends)"
type = "forbidden"
source_modules = ["waitlist.web", "waitlist.control", "waitlist.agent"]
forbidden_modules = ["waitlist.providers.buntzen.client", "waitlist.fetcher"]

[[tool.importlinter.contracts]]
name = "waitlist-fetcher holds nothing: no database, no Kubernetes, no app, no browser"
type = "forbidden"
source_modules = ["waitlist.fetcher"]
forbidden_modules = [
  "asyncpg",
  "jwt",
  "playwright",
  "selectolax",
  "waitlist.agent",
  "waitlist.control",
  "waitlist.web",
  "waitlist.tickets",
  "waitlist.bcferries",
]

[[tool.importlinter.contracts]]
name = "Providers don't know about each other"
type = "independence"
modules = ["waitlist.providers.bcferries", "waitlist.providers.buntzen"]

[[tool.importlinter.contracts]]
name = "The HTTP check loop never touches Kubernetes or a browser"
type = "forbidden"
source_modules = ["waitlist.control.checks", "waitlist.control.checkplan", "waitlist.control.fetch"]
forbidden_modules = [
  "waitlist.control.kube",
  "waitlist.control.fleet",
  "waitlist.control.pods",
  "waitlist.control.hub",
  "waitlist.control.config",
  "waitlist.control.main",
  "waitlist.agent",
  "playwright",
  "selectolax",
]

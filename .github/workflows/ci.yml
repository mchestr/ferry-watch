name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  python:
    name: Python (lint, types, unit tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check --output-format=github
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest -m "not browser and not apiserver" --cov=ferry_watch --cov-report=term-missing
      - name: Playwright package matches the image's browsers
        run: |
          lock="$(uv export --locked --no-hashes --no-dev --extra browser | sed -n 's/^playwright==\([0-9.]*\).*/\1/p')"
          image="$(sed -n 's|^FROM mcr.microsoft.com/playwright/python:v\([0-9.]*\)-.*|\1|p' Dockerfile)"
          echo "uv.lock has playwright $lock, the Dockerfile uses the $image image"
          test -n "$lock" && test "$lock" = "$image"
      - name: vnc-edge's KasmVNC client matches the browser image's server
        run: |
          server="$(sed -n 's/^ARG KASMVNC_VERSION=//p' Dockerfile)"
          client="$(sed -n 's/^ARG KASMVNC_VERSION=//p' vnc-edge/Dockerfile)"
          echo "The browser image has KasmVNC $server, vnc-edge serves the $client client"
          test -n "$client" && test "$client" = "$server"

  browser:
    name: Browser contract tests
    runs-on: ubuntu-24.04
    # The same Chromium as production.
    container: mcr.microsoft.com/playwright/python:v1.56.0-noble@sha256:a7f6cf3ae520c9d670ad956572c13747ed5abdbba5123a01526f873ed1662528
    env:
      UV_PYTHON: /usr/bin/python3
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - name: KasmVNC's web client, for the checkout edge tests
        run: |
          version="$(sed -n 's/^ARG KASMVNC_VERSION=//p' vnc-edge/Dockerfile)"
          sum="$(sed -n 's/^ARG KASMVNC_SHA256=//p' vnc-edge/Dockerfile)"
          deb="$RUNNER_TEMP/kasmvnc.deb"
          python3 -I -c 'import sys, urllib.request; urllib.request.urlretrieve(sys.argv[1], sys.argv[2])' \
            "https://github.com/kasmtech/KasmVNC/releases/download/v${version}/kasmvncserver_noble_${version}_amd64.deb" "$deb"
          echo "${sum}  ${deb}" | sha256sum -c -
          dpkg-deb -x "$deb" "$RUNNER_TEMP/kasmvnc"
          echo "FW_KASMVNC_WWW=$RUNNER_TEMP/kasmvnc/usr/share/kasmvnc/www" >> "$GITHUB_ENV"
      - run: uv run pytest -m browser

  deploy:
    name: Deployment (app-template render, kubeconform)
    runs-on: ubuntu-24.04
    env:
      HELM_IMAGE: alpine/helm:3.19.0@sha256:aef9b56f64e866207d9591d0abd8f6d767b36aadd12edf68f8a719716d9d29c9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Tools
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kubeconform.tgz" \
            https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          echo "c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3  $RUNNER_TEMP/kubeconform.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kubeconform.tgz" -C "$RUNNER_TEMP" kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          id="$(docker create "$HELM_IMAGE")"
          docker cp "$id:/usr/bin/helm" "$RUNNER_TEMP/helm"
          docker rm "$id"
          echo "FW_HELM=$RUNNER_TEMP/helm" >> "$GITHUB_ENV"
      # deploy/helmrelease.yaml (home-cluster's copy) through app-template, as helm-controller renders it.
      - run: uv run python -m tests.deploy > rendered.yaml
      - name: kubeconform
        run: |
          kubeconform -strict -summary -kubernetes-version 1.36.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered.yaml

  apiserver:
    name: Admission and RBAC on a real API server
    runs-on: ubuntu-24.04
    env:
      HELM_IMAGE: alpine/helm:3.19.0@sha256:aef9b56f64e866207d9591d0abd8f6d767b36aadd12edf68f8a719716d9d29c9
      # controller-tools' envtest binaries for the cluster's Kubernetes minor (home-cluster runs 1.36).
      ENVTEST_VERSION: v1.36.2
      ENVTEST_SHA512: ea743186c8a799f5cf8faf16969f86189d003cb7d130e0ac4b58789f1e5748dcf30ebe91c837a10d5ac415383da3e10b9e64d65785c938c23e739781cfb76f08
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: envtest and helm
        run: |
          archive="$RUNNER_TEMP/envtest.tgz"
          curl -fsSL -o "$archive" \
            "https://github.com/kubernetes-sigs/controller-tools/releases/download/envtest-${ENVTEST_VERSION}/envtest-${ENVTEST_VERSION}-linux-amd64.tar.gz"
          echo "${ENVTEST_SHA512}  ${archive}" | sha512sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          id="$(docker create "$HELM_IMAGE")"
          docker cp "$id:/usr/bin/helm" "$RUNNER_TEMP/helm"
          docker rm "$id"
          echo "FW_ENVTEST_BIN=$RUNNER_TEMP/controller-tools/envtest" >> "$GITHUB_ENV"
          echo "FW_HELM=$RUNNER_TEMP/helm" >> "$GITHUB_ENV"
      - run: uv run pytest -m apiserver --timeout 300

  web:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    name: Image ${{ matrix.target }} (build, smoke test, push)
    needs: [python, browser, web, deploy, apiserver]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: app # today's single-container app
            suffix: ""
          - target: control # ferry-web and ferry-control
            suffix: -control
          - target: browser # one browser pod
            suffix: -browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}${{ matrix.suffix }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          tags: ferry-watch-${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}
          # Only trusted pushes write the shared build cache; pull requests just read it.
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope={0}', matrix.target) || '' }}
      - name: Smoke test
        if: matrix.target == 'app'
        run: |
          docker run -d --name smoke -p 8765:8765 -p 6080:6080 ferry-watch-app:ci
          for _ in $(seq 30); do curl -fsS localhost:8765/healthz && break; sleep 2; done
          curl -fsS localhost:8765/ | grep -q '<div id="root">'
          curl -fsS localhost:8765/api/state | python3 -c 'import json, sys; assert json.load(sys.stdin)["trips"] == []'
          curl -fsS -o /dev/null localhost:6080/vnc/vnc.html
      - name: Smoke test
        if: matrix.target != 'app'
        run: docker/${{ matrix.target }}/smoke-test.sh ferry-watch-${{ matrix.target }}:ci
      - name: Smoke test logs
        if: always() && matrix.target == 'app'
        run: docker logs smoke || true
      - if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}

  vnc-edge:
    name: vnc-edge image (build, smoke test, push)
    needs: [python, browser]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}-vnc-edge
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: vnc-edge
          platforms: linux/amd64
          load: true
          tags: ferry-watch-vnc-edge:ci
          cache-from: type=gha,scope=vnc-edge
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=vnc-edge' || '' }}
      - name: Smoke test
        run: |
          # As it runs in the cluster: read-only, unprivileged, no capabilities. nginx resolves its
          # resolver's name at startup, so point that name somewhere.
          docker run -d --name smoke -p 8080:8080 --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges --user 101:101 \
            --add-host kube-dns.kube-system.svc.cluster.local:127.0.0.1 ferry-watch-vnc-edge:ci
          for _ in $(seq 30); do curl -fsS -o /dev/null localhost:8080/vnc.html && break; sleep 1; done
          vnc-edge/smoke-test.sh http://localhost:8080
      - name: Smoke test logs
        if: always()
        run: docker logs smoke || true
      - if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: vnc-edge
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=vnc-edge

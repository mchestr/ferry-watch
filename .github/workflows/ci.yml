name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # Images are pushed for main and for v* tags: on a push, or when the Release workflow starts CI on the tag it
  # made (a tag pushed with a workflow's own token doesn't start CI by itself). Pull requests never push.
  PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')) }}

jobs:
  python:
    name: Python (lint, types, unit tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check --output-format=github
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest -m "not browser" --cov=waitlist --cov-report=term-missing
      - name: Playwright package matches the image's browsers
        run: |
          lock="$(uv export --locked --no-hashes --no-dev --extra browser | sed -n 's/^playwright==\([0-9.]*\).*/\1/p')"
          image="$(sed -n 's|^FROM mcr.microsoft.com/playwright/python:v\([0-9.]*\)-.*|\1|p' Dockerfile)"
          echo "uv.lock has playwright $lock, the Dockerfile uses the $image image"
          test -n "$lock" && test "$lock" = "$image"
      - name: vnc-edge's KasmVNC client matches the browser image's server
        run: |
          server="$(sed -n 's/^ARG KASMVNC_VERSION=//p' Dockerfile)"
          client="$(sed -n 's/^ARG KASMVNC_VERSION=//p' vnc-edge/Dockerfile)"
          echo "The browser image has KasmVNC $server, vnc-edge serves the $client client"
          test -n "$client" && test "$client" = "$server"

  browser:
    name: Browser contract tests
    runs-on: ubuntu-24.04
    # The same Chromium as production.
    container: mcr.microsoft.com/playwright/python:v1.56.0-noble@sha256:a7f6cf3ae520c9d670ad956572c13747ed5abdbba5123a01526f873ed1662528
    env:
      UV_PYTHON: /usr/bin/python3
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      # KasmVNC's web client for the checkout tests, and its Xvnc with matchbox, xrandr and xsettingsd, installed as
      # the browser image installs them, so test_checkout_screen.py can run the pod's real screen.
      - name: KasmVNC, matchbox, xrandr and xsettingsd, for the checkout tests
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          version="$(sed -n 's/^ARG KASMVNC_VERSION=//p' vnc-edge/Dockerfile)"
          sum="$(sed -n 's/^ARG KASMVNC_SHA256=//p' vnc-edge/Dockerfile)"
          deb="$RUNNER_TEMP/kasmvnc.deb"
          python3 -I -c 'import sys, urllib.request; urllib.request.urlretrieve(sys.argv[1], sys.argv[2])' \
            "https://github.com/kasmtech/KasmVNC/releases/download/v${version}/kasmvncserver_noble_${version}_amd64.deb" "$deb"
          echo "${sum}  ${deb}" | sha256sum -c -
          apt-get update
          apt-get install -y --no-install-recommends matchbox-window-manager xsettingsd x11-xserver-utils "$deb"
          for tool in Xvnc matchbox-window-manager xrandr xsettingsd; do command -v "$tool"; done
          echo "WL_KASMVNC_WWW=/usr/share/kasmvnc/www" >> "$GITHUB_ENV"
      - run: uv run pytest -m browser

  web:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The streamed checkout viewer's DOM-free modules, against the wl.cast1 conformance pack. No npm packages.
      - name: vnc-edge viewer modules
        working-directory: .
        run: node --test vnc-edge/tests/*.test.mjs

  image:
    name: Image ${{ matrix.target }} (build, smoke test, push)
    needs: [python, browser, web]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: control # waitlist-web and waitlist-control
            suffix: -control
          - target: browser # one browser pod
            suffix: -browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}${{ matrix.suffix }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          tags: waitlist-${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}
          # Only trusted pushes write the shared build cache; pull requests just read it.
          cache-to: ${{ env.PUBLISH == 'true' && format('type=gha,mode=max,scope={0}', matrix.target) || '' }}
      - name: Smoke test
        run: docker/${{ matrix.target }}/smoke-test.sh waitlist-${{ matrix.target }}:ci
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}

  vnc-edge:
    name: vnc-edge image (build, smoke test, push)
    needs: [python, browser]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}-vnc-edge
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: vnc-edge
          platforms: linux/amd64
          load: true
          tags: waitlist-vnc-edge:ci
          cache-from: type=gha,scope=vnc-edge
          cache-to: ${{ env.PUBLISH == 'true' && 'type=gha,mode=max,scope=vnc-edge' || '' }}
      - name: Smoke test
        run: |
          # As it runs in the cluster: read-only, unprivileged, no capabilities. nginx resolves its
          # resolver's name at startup, so point that name somewhere.
          docker run -d --name smoke -p 8080:8080 --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges --user 101:101 \
            --add-host kube-dns.kube-system.svc.cluster.local:127.0.0.1 waitlist-vnc-edge:ci
          for _ in $(seq 30); do curl -fsS -o /dev/null localhost:8080/vnc.html && break; sleep 1; done
          vnc-edge/smoke-test.sh http://localhost:8080
      - name: Smoke test logs
        if: always()
        run: docker logs smoke || true
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: vnc-edge
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=vnc-edge

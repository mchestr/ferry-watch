<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ferry Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --fg: #0f1b2d;
  --fg-2: #4a5768;
  --fg-3: #8592a3;
  --line: #e3e8ef;
  --accent: #0b5cad;
  --accent-fg: #ffffff;
  --accent-soft: #e8f1fb;
  --ok: #12805c;
  --ok-soft: #e3f5ee;
  --warn: #a15c07;
  --warn-soft: #fdf3e2;
  --bad: #c0362c;
  --bad-soft: #fcebea;
  --shadow: 0 1px 2px rgba(15, 27, 45, .04), 0 4px 16px rgba(15, 27, 45, .06);
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b111a;
    --surface: #121a26;
    --surface-2: #172131;
    --fg: #e8edf4;
    --fg-2: #a9b4c3;
    --fg-3: #6f7c8e;
    --line: #223044;
    --accent: #4d9be8;
    --accent-fg: #06121f;
    --accent-soft: #14263c;
    --ok: #3fc495;
    --ok-soft: #0f2a22;
    --warn: #e4a54a;
    --warn-soft: #2b2112;
    --bad: #f07a70;
    --bad-soft: #2e1716;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "cv11", "ss01";
}
button, input, select { font: inherit; color: inherit; }
.wrap { max-width: 880px; margin: 0 auto; padding: 0 16px 48px; }

/* header */
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 0; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; letter-spacing: -.01em; }
.brand-mark { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; }
.toggle { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; font-size: 14px; font-weight: 500; color: var(--fg-2); }
.toggle input { display: none; }
.track { width: 38px; height: 22px; border-radius: 11px; background: var(--line); position: relative; transition: background .2s; }
.track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .2s; }
.toggle input:checked + .track { background: var(--ok); }
.toggle input:checked + .track::after { transform: translateX(16px); }

/* cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card + .card { margin-top: 16px; }

/* trip hero */
.trip { padding: 24px; }
.trip-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-3); }
.route { display: flex; align-items: center; gap: 14px; margin-top: 6px; flex-wrap: wrap; }
.term-name { font-size: 26px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
.term-city { font-size: 13px; color: var(--fg-2); }
.route-arrow { color: var(--fg-3); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-size: 13px; color: var(--fg-2); font-weight: 500; }
.chip svg { color: var(--fg-3); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: 10px; border: 1px solid transparent; font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; transition: background .15s, border-color .15s, opacity .15s; white-space: nowrap; }
.btn:disabled { opacity: .55; cursor: default; }
.btn-primary { background: var(--accent); color: var(--accent-fg); }
.btn-primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn-ghost { background: transparent; border-color: var(--line); color: var(--fg); }
.btn-ghost:hover:not(:disabled) { background: var(--surface-2); }
.btn-ok { background: var(--ok); color: #fff; }
.btn-lg { height: 46px; padding: 0 22px; font-size: 15px; border-radius: 12px; }

/* status strip */
.status { margin-top: 22px; padding: 16px 18px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; background: var(--surface-2); border: 1px solid var(--line); }
.status.ok { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
.status.bad { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 35%, transparent); }
.status-main { display: flex; align-items: center; gap: 12px; min-width: 0; }
.status-title { font-weight: 600; }
.status-sub { font-size: 13px; color: var(--fg-2); font-variant-numeric: tabular-nums; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--fg-3); }
.dot.live { background: var(--ok); box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 60%, transparent); animation: pulse 2s infinite; }
.dot.ok { background: var(--ok); }
.dot.bad { background: var(--bad); }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 70% { box-shadow: 0 0 0 8px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.status-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* settings */
.settings { overflow: hidden; }
.settings-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; cursor: pointer; user-select: none; }
.settings-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
.chev { transition: transform .2s; color: var(--fg-3); }
.settings.open .chev { transform: rotate(180deg); }
.settings-body { display: none; padding: 4px 24px 24px; border-top: 1px solid var(--line); }
.settings.open .settings-body { display: block; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 18px; }
.grid .span-2 { grid-column: span 2; }
@media (max-width: 640px) { .grid { grid-template-columns: minmax(0, 1fr); } .grid .span-2 { grid-column: auto; } .term-name { font-size: 22px; } .trip { padding: 20px; } }
.field label, .field .label { display: block; font-size: 13px; font-weight: 500; color: var(--fg-2); margin-bottom: 6px; }
.input, select.input { width: 100%; height: 42px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); transition: border-color .15s, box-shadow .15s; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 3px; gap: 3px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 11px; }
.seg button { height: 34px; border: 0; border-radius: 8px; background: transparent; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--fg-2); }
.seg button.on { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(15,27,45,.12); font-weight: 600; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; height: 42px; background: var(--surface); }
.stepper button { width: 40px; height: 100%; border: 0; background: transparent; cursor: pointer; color: var(--fg-2); font-size: 18px; }
.stepper button:hover { color: var(--accent); }
.stepper span { min-width: 28px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.pax { display: flex; flex-wrap: wrap; gap: 16px 24px; }
.pax .field .label { margin-bottom: 6px; }
details.adv { margin-top: 22px; border-top: 1px dashed var(--line); padding-top: 14px; }
details.adv summary { cursor: pointer; font-size: 14px; font-weight: 600; color: var(--fg-2); list-style: none; display: flex; align-items: center; gap: 6px; }
details.adv summary::-webkit-details-marker { display: none; }
details.adv summary svg { transition: transform .2s; }
details.adv[open] summary svg { transform: rotate(90deg); }
.hint { font-size: 12px; color: var(--fg-3); margin-top: 6px; }
.form-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }

/* sailings */
.sailings-head { display: flex; align-items: baseline; justify-content: space-between; padding: 18px 24px 10px; gap: 12px; flex-wrap: wrap; }
.sailings-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
.sailings-head .meta { font-size: 13px; color: var(--fg-3); }
.list { list-style: none; margin: 0; padding: 0 12px 12px; }
.sail { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; align-items: center; gap: 14px; padding: 12px; border-radius: 10px; }
.sail + .sail { border-top: 1px solid var(--line); }
.sail.avail { background: var(--ok-soft); border-top-color: transparent; }
.sail.avail + .sail { border-top-color: transparent; }
.sail.out { opacity: .45; }
.sail-time { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.sail-info { min-width: 0; }
.sail-vessel { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sail-sub { font-size: 13px; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.badge { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.badge.ok { background: var(--ok); color: #fff; }
.badge.sold { background: var(--surface-2); color: var(--fg-3); border: 1px solid var(--line); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
@media (max-width: 640px) {
  .list { padding: 0 6px 8px; }
  .sail { grid-template-columns: 74px minmax(0, 1fr) auto; gap: 10px; padding: 12px 10px; }
  .sail-time { font-size: 15px; }
  .sail-vessel { white-space: normal; font-size: 14px; line-height: 1.3; }
  .status-actions { width: 100%; }
  .status-actions .btn { flex: 1; }
}
.empty { padding: 36px 24px 44px; text-align: center; color: var(--fg-3); }
.empty .spinner { margin: 0 auto 12px; width: 22px; height: 22px; }

.hold { margin-top: 14px; padding: 14px 18px; border-radius: 12px; display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); }
.hold.failed { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 30%, transparent); }
.hold-main { display: flex; gap: 12px; align-items: center; min-width: 0; }
.hold-icon { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; flex: none; }
.hold.failed .hold-icon { background: var(--bad); color: #fff; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 42px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.switch-row .toggle { display: inline-flex; margin: 0; flex: none; }
.track { display: inline-block; flex: none; }
footer { margin-top: 18px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 12.5px; color: var(--fg-3); }
.err { margin-top: 12px; font-size: 13px; color: var(--bad); word-break: break-word; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 500; transition: all .25s; pointer-events: none; box-shadow: var(--shadow); z-index: 10; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="brand-mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20c1.5 1 3 1 4.5 0s3-1 4.5 0 3 1 4.5 0 3-1 4.5 0"/><path d="M4 17l-1-5h18l-2 5"/><path d="M6 12V8h10l2 4"/><path d="M10 8V5h3"/></svg>
      </div>
      Ferry Watch
    </div>
    <label class="toggle" title="Pause or resume automatic checks">
      <span id="watchLabel">Watching</span>
      <input type="checkbox" id="enabled">
      <span class="track"></span>
    </label>
  </header>

  <section class="card trip">
    <div class="trip-top">
      <div>
        <div class="eyebrow" id="tripDate">—</div>
        <div class="route">
          <div><div class="term-name" id="fromName">—</div><div class="term-city" id="fromCity"></div></div>
          <svg class="route-arrow" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          <div><div class="term-name" id="toName">—</div><div class="term-city" id="toCity"></div></div>
        </div>
      </div>
      <a class="btn btn-ghost" id="bookLink" href="#" target="_blank" rel="noopener">
        BC Ferries
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></svg>
      </a>
    </div>
    <div class="chips" id="chips"></div>

    <div class="status" id="status">
      <div class="status-main">
        <span class="dot" id="statusDot"></span>
        <div>
          <div class="status-title" id="statusTitle">Loading…</div>
          <div class="status-sub" id="statusSub"></div>
        </div>
      </div>
      <div class="status-actions" id="statusActions">
        <button class="btn btn-ghost" id="checkBtn">Check now</button>
      </div>
    </div>
    <div class="hold" id="hold" hidden></div>
    <div class="err" id="err" hidden></div>
  </section>

  <section class="card settings" id="settings">
    <div class="settings-head" id="settingsHead">
      <h2>Trip settings</h2>
      <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <form class="settings-body" id="form" autocomplete="off">
      <div class="grid">
        <div class="field">
          <label for="from">From</label>
          <select class="input" id="from"></select>
        </div>
        <div class="field">
          <label for="to">To</label>
          <select class="input" id="to"></select>
        </div>
        <div class="field">
          <label for="date">Date</label>
          <input class="input" type="date" id="date" required>
        </div>
        <div class="field">
          <span class="label">Adults</span>
          <div class="stepper" data-key="adults"><button type="button" data-d="-1">−</button><span>1</span><button type="button" data-d="1">+</button></div>
        </div>
        <div class="field span-2">
          <span class="label">Vehicle</span>
          <div class="seg" id="vehicle">
            <button type="button" data-v="standard">Car / SUV</button>
            <button type="button" data-v="tall">Over 7 ft</button>
            <button type="button" data-v="none">Walk-on</button>
          </div>
        </div>
        <div class="field" id="heightField" hidden>
          <label for="height_ft">Vehicle height (ft)</label>
          <input class="input" type="number" id="height_ft" min="7.1" max="14" step="0.1">
        </div>
      </div>

      <details class="adv">
        <summary>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          Advanced
        </summary>
        <div class="grid">
          <div class="field span-2">
            <span class="label">More passengers</span>
            <div class="pax">
              <div class="field"><span class="label">Children 5–11</span><div class="stepper" data-key="children"><button type="button" data-d="-1">−</button><span>0</span><button type="button" data-d="1">+</button></div></div>
              <div class="field"><span class="label">Infants 0–4</span><div class="stepper" data-key="infants"><button type="button" data-d="-1">−</button><span>0</span><button type="button" data-d="1">+</button></div></div>
              <div class="field"><span class="label">BC seniors 65+</span><div class="stepper" data-key="seniors"><button type="button" data-d="-1">−</button><span>0</span><button type="button" data-d="1">+</button></div></div>
            </div>
          </div>
          <div class="field">
            <span class="label" id="holdLabel">Add to cart automatically</span>
            <div class="switch-row">
              <span style="font-size:13px;color:var(--fg-2)" id="holdHint">Opens a browser window at checkout</span>
              <label class="toggle"><input type="checkbox" id="holdToggle"><span class="track"></span></label>
            </div>
          </div>
          <div class="field">
            <label for="fare">Fare to pick</label>
            <select class="input" id="fare">
              <option value="cheapest">Cheapest available</option>
              <option value="saver">Saver</option>
              <option value="prepaid">Prepaid</option>
              <option value="reservation">Reservation Only ($20 fee, pay rest at terminal)</option>
            </select>
          </div>
          <div class="field">
            <label for="earliest">Earliest departure</label>
            <input class="input" type="time" id="earliest">
          </div>
          <div class="field">
            <label for="latest">Latest departure</label>
            <input class="input" type="time" id="latest">
            <div class="hint">You only get alerts for sailings inside this window.</div>
          </div>
          <div class="field">
            <label for="interval_minutes">Check every</label>
            <select class="input" id="interval_minutes">
              <option value="2">2 minutes</option>
              <option value="5">5 minutes</option>
              <option value="10">10 minutes</option>
              <option value="15">15 minutes</option>
              <option value="30">30 minutes</option>
            </select>
          </div>
          <div class="field">
            <span class="label">Notifications</span>
            <button type="button" class="btn btn-ghost" id="testBtn" style="width:100%;height:42px">Send test notification</button>
          </div>
        </div>
      </details>

      <div class="form-foot">
        <button type="button" class="btn btn-ghost" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="saveBtn">Save &amp; check</button>
      </div>
    </form>
  </section>

  <section class="card">
    <div class="sailings-head">
      <h2>Sailings</h2>
      <span class="meta" id="sailMeta"></span>
    </div>
    <ul class="list" id="list"></ul>
  </section>

  <footer>
    <span id="footLeft"></span>
    <span id="footRight"></span>
  </footer>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let S = null;          // last /api/state
let T = {};            // terminals
let draft = null;      // settings being edited
let dirty = false;
let clockSkew = 0;

const api = async (path, body) => {
  const r = await fetch(path, body === undefined ? { cache: "no-store" } : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
};

const toast = (msg) => {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2600);
};

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const fmtDate = (iso) => new Date(iso + "T12:00:00").toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" });
const fmtTime12 = (hhmm) => { const [h, m] = hhmm.split(":").map(Number); return `${((h + 11) % 12) + 1}:${String(m).padStart(2, "0")} ${h < 12 ? "am" : "pm"}`; };
const ago = (iso) => {
  const s = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
  if (s < 10) return "just now"; if (s < 60) return `${s}s ago`;
  const m = Math.round(s / 60); return m < 60 ? `${m} min ago` : new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
};
const countdown = (epoch) => {
  const s = Math.max(0, Math.round(epoch - (Date.now() / 1000 - clockSkew)));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
};
const duration = (a, b) => {
  const toM = (t) => { const m = t.match(/(\d+):(\d+)\s*(am|pm)/i); let h = +m[1] % 12; if (m[3].toLowerCase() === "pm") h += 12; return h * 60 + +m[2]; };
  try { const d = (toM(b) - toM(a) + 1440) % 1440; return `${Math.floor(d / 60)}h ${String(d % 60).padStart(2, "0")}m`; } catch { return ""; }
};

const ICON = {
  user: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>',
  car: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14v-5l-2-5H7l-2 5z"/><circle cx="8" cy="17" r="2"/><circle cx="16" cy="17" r="2"/></svg>',
  walk: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="2"/><path d="M10 22l2-7 3 3v6M8 12l3-4 4 2 2 3"/></svg>',
  clock: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  bell: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 004 0"/></svg>',
};

function paxLabel(c) {
  const parts = [["adults", "adult", "adults"], ["children", "child", "children"], ["infants", "infant", "infants"], ["seniors", "senior", "seniors"]]
    .filter(([k]) => +c[k] > 0).map(([k, one, many]) => `${c[k]} ${+c[k] === 1 ? one : many}`);
  return parts.join(", ") || "No passengers";
}
const vehicleLabel = (c) => c.vehicle === "none" ? "Walk-on" : c.vehicle === "tall" ? `Vehicle over 7 ft (${c.height_ft} ft)` : "Standard vehicle";
const windowLabel = (c) => (c.earliest <= "00:00" && c.latest >= "23:59") ? "Any time" : `${fmtTime12(c.earliest)} – ${fmtTime12(c.latest)}`;

function renderTrip() {
  const c = S.config, f = T[c.from], t = T[c.to];
  $("tripDate").textContent = fmtDate(c.date);
  const split = (term) => { const m = (term?.short || "").match(/^(.*?)\s*\((.*)\)$/); return m ? [m[2], m[1]] : [term?.short || "—", ""]; };
  const [fn, fc] = split(f), [tn, tc] = split(t);
  $("fromName").textContent = fn; $("fromCity").textContent = fc;
  $("toName").textContent = tn; $("toCity").textContent = tc;
  $("bookLink").href = S.booking_link;
  $("chips").innerHTML = [
    [ICON.user, paxLabel(c)],
    [c.vehicle === "none" ? ICON.walk : ICON.car, vehicleLabel(c)],
    [ICON.clock, windowLabel(c)],
    ...(c.hold ? [['<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a2 2 0 002 1.6h8.6a2 2 0 002-1.6L22 7H6"/></svg>', "Auto-cart"]] : []),
  ].map(([i, l]) => `<span class="chip">${i}${esc(l)}</span>`).join("");
  $("enabled").checked = c.enabled;
  $("watchLabel").textContent = c.enabled ? "Watching" : "Paused";
}

function renderStatus() {
  const c = S.config, sail = S.sailings || [];
  const inWin = sail.filter((s) => s.in_window !== false);
  const avail = inWin.filter((s) => s.status === "available");
  const st = $("status"), dot = $("statusDot"), title = $("statusTitle"), sub = $("statusSub"), acts = $("statusActions");
  st.className = "status"; dot.className = "dot";
  let actions = `<button class="btn btn-ghost" id="checkBtn" ${S.checking ? "disabled" : ""}>Check now</button>`;

  if (S.checking && !sail.length) {
    dot.className = "spinner";
    title.textContent = "Checking BC Ferries…"; sub.textContent = "This takes about 10 seconds";
  } else if (avail.length) {
    st.classList.add("ok"); dot.classList.add("ok");
    title.textContent = `${avail.length} sailing${avail.length > 1 ? "s" : ""} bookable now`;
    sub.textContent = avail.map((s) => s.depart).join(" · ");
    actions = `<a class="btn btn-ok btn-lg" href="${esc(S.booking_link)}" target="_blank" rel="noopener">Book on BC Ferries</a>` + actions;
  } else if (S.last_error && !sail.length) {
    st.classList.add("bad"); dot.classList.add("bad");
    title.textContent = "Last check failed"; sub.textContent = "Will retry automatically";
  } else if (!sail.length) {
    title.textContent = c.enabled ? "Waiting for first check" : "Paused";
    sub.textContent = "";
  } else {
    if (S.checking) dot.className = "spinner"; else if (c.enabled) dot.classList.add("live");
    title.textContent = "No reservations available yet";
    sub.textContent = `${inWin.length} sailing${inWin.length === 1 ? "" : "s"} in your window, all sold out`;
  }
  // live timing line
  if (sail.length || S.last_error) {
    const bits = [];
    if (S.checking) bits.push("Checking now…");
    else if (c.enabled && S.next_check) bits.push(`Next check in ${countdown(S.next_check)}`);
    else if (!c.enabled) bits.push("Paused");
    if (S.last_check) bits.push(`updated ${ago(S.last_check)}`);
    if (!avail.length) sub.textContent += (sub.textContent ? " · " : "") + bits.join(" · ");
  }
  if (acts.dataset.html !== actions) { acts.innerHTML = actions; acts.dataset.html = actions; $("checkBtn").onclick = checkNow; }

  const err = $("err");
  if (S.last_error) { err.hidden = false; err.textContent = S.last_error; } else err.hidden = true;
}

function renderSailings() {
  const sail = S.sailings || [];
  const list = $("list");
  if (!sail.length) {
    list.innerHTML = `<li class="empty">${S.checking ? '<div class="spinner"></div>Fetching sailings from BC Ferries…' : "No results yet"}</li>`;
    $("sailMeta").textContent = "";
    return;
  }
  const avail = sail.filter((s) => s.status === "available" && s.in_window !== false).length;
  $("sailMeta").textContent = `${avail} of ${sail.length} bookable`;
  const html = sail.map((s) => {
    const ok = s.status === "available", out = s.in_window === false;
    const badge = ok ? `<span class="badge ok">Bookable${s.price ? " · " + esc(s.price) : ""}</span>`
      : /sold out/i.test(s.status) ? `<span class="badge sold">Sold out</span>`
      : `<span class="badge warn">${esc(s.status)}</span>`;
    return `<li class="sail ${ok && !out ? "avail" : ""} ${out ? "out" : ""}">
      <div class="sail-time">${esc(s.depart)}</div>
      <div class="sail-info"><div class="sail-vessel">${esc(s.vessel)}</div>
        <div class="sail-sub">Arrives ${esc(s.arrive)} · ${duration(s.depart, s.arrive)}${out ? " · outside your window" : ""}</div></div>
      ${badge}</li>`;
  }).join("");
  if (list.dataset.html !== html) { list.innerHTML = html; list.dataset.html = html; }
}

function renderHold() {
  const h = S.hold, el = $("hold");
  if (!h || h.status === "closed") { el.hidden = true; el.dataset.html = ""; return; }
  const cart = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a2 2 0 002 1.6h8.6a2 2 0 002-1.6L22 7H6"/></svg>';
  let title, sub, action = "", cls = "hold";
  if (h.status === "adding") {
    title = `Adding ${esc(h.depart)} to your cart…`; sub = "Logging in and selecting the fare in a browser window on this Mac";
  } else if (h.status === "ready") {
    title = `${esc(h.depart)} is in your cart`;
    sub = `${esc(h.fare)} ${esc(h.price)} · finish checkout in the ${S.vnc_url ? "checkout browser" : "browser window"}. Not booked until you pay.`;
    if (S.vnc_url) action = `<a class="btn btn-primary" href="${esc(S.vnc_url)}" target="_blank" rel="noopener">Open checkout</a>`;
  } else {
    cls += " failed"; title = `Couldn't add ${esc(h.depart)} to the cart`; sub = esc(h.error || "");
    action = '<button class="btn btn-ghost" id="holdDismiss">Dismiss</button>';
  }
  const html = `<div class="hold-main"><div class="hold-icon">${h.status === "adding" ? '<div class="spinner" style="border-color:rgba(255,255,255,.35);border-top-color:#fff"></div>' : cart}</div>
    <div><div class="status-title">${title}</div><div class="status-sub">${sub}</div></div></div>${action}`;
  el.className = cls; el.hidden = false;
  if (el.dataset.html !== html) {
    el.innerHTML = html; el.dataset.html = html;
    const d = $("holdDismiss"); if (d) d.onclick = async () => { S = await api("/api/hold/dismiss", {}); render(); };
  }
}

function renderFooter() {
  $("footLeft").innerHTML = S.pushover ? `${ICON.bell} Pushover alerts on` : `<span style="color:var(--bad)">Pushover not configured</span>`;
  $("footRight").textContent = S.config.enabled ? `Checks every ${S.config.interval_minutes} min` : "Automatic checks paused";
}

function render() {
  if (!S) return;
  renderTrip(); renderStatus(); renderHold(); renderSailings(); renderFooter();
  if (!dirty) loadDraft();
}

/* ---------- settings form ---------- */
function fillTerminals() {
  const opts = (codes, sel) => codes.map((c) => `<option value="${c}" ${c === sel ? "selected" : ""}>${esc(T[c].label)}</option>`).join("");
  const origins = Object.keys(T).filter((c) => T[c].dests.length).sort((a, b) => T[a].label.localeCompare(T[b].label));
  $("from").innerHTML = opts(origins, draft.from);
  const dests = (T[draft.from]?.dests || []).filter((c) => T[c]).sort((a, b) => T[a].label.localeCompare(T[b].label));
  if (!dests.includes(draft.to)) draft.to = dests[0];
  $("to").innerHTML = opts(dests, draft.to);
}
function loadDraft() {
  draft = { ...S.config };
  paintDraft();
}
function paintDraft() {
  fillTerminals();
  $("date").value = draft.date;
  $("earliest").value = draft.earliest; $("latest").value = draft.latest;
  $("height_ft").value = draft.height_ft;
  const iv = $("interval_minutes");
  if (![...iv.options].some((o) => +o.value === +draft.interval_minutes)) iv.add(new Option(`${draft.interval_minutes} minutes`, draft.interval_minutes));
  iv.value = String(draft.interval_minutes);
  document.querySelectorAll(".stepper").forEach((el) => el.querySelector("span").textContent = draft[el.dataset.key]);
  document.querySelectorAll("#vehicle button").forEach((b) => b.classList.toggle("on", b.dataset.v === draft.vehicle));
  $("heightField").hidden = draft.vehicle !== "tall";
  $("holdToggle").checked = !!draft.hold;
  $("fare").value = draft.fare || "cheapest";
  $("fare").disabled = !draft.hold;
  $("holdHint").textContent = !S.login ? "Needs a BC Ferries login" : S.vnc_url ? "Opens a checkout browser you can control" : "Opens a browser window at checkout";
}
const touch = () => { dirty = true; };

$("form").addEventListener("input", (e) => {
  touch();
  const id = e.target.id;
  if (["date", "earliest", "latest", "to"].includes(id)) draft[id] = e.target.value;
  if (id === "from") { draft.from = e.target.value; fillTerminals(); }
  if (id === "height_ft") draft.height_ft = parseFloat(e.target.value) || 8;
  if (id === "interval_minutes") draft.interval_minutes = +e.target.value;
  if (id === "fare") draft.fare = e.target.value;
  if (id === "holdToggle") { draft.hold = e.target.checked; paintDraft(); }
});
document.querySelectorAll(".stepper").forEach((el) => el.addEventListener("click", (e) => {
  const d = +e.target.dataset.d; if (!d) return;
  const k = el.dataset.key, min = k === "adults" ? 1 : 0;
  draft[k] = Math.max(min, Math.min(9, +draft[k] + d)); touch(); paintDraft();
}));
$("vehicle").addEventListener("click", (e) => { const v = e.target.dataset.v; if (!v) return; draft.vehicle = v; touch(); paintDraft(); });

$("settingsHead").onclick = () => $("settings").classList.toggle("open");
$("cancelBtn").onclick = () => { dirty = false; loadDraft(); $("settings").classList.remove("open"); };
$("form").onsubmit = async (e) => {
  e.preventDefault();
  $("saveBtn").disabled = true;
  try {
    S = await api("/api/config", draft);
    dirty = false; $("settings").classList.remove("open");
    toast("Saved, checking now…"); render(); poll();
  } catch (err) { toast("Save failed: " + err.message); }
  finally { $("saveBtn").disabled = false; }
};
$("enabled").onchange = async (e) => {
  S = await api("/api/config", { enabled: e.target.checked });
  toast(e.target.checked ? "Watching resumed" : "Watching paused"); render();
};
$("testBtn").onclick = async () => {
  try { await api("/api/test", {}); toast("Test notification sent"); } catch (err) { toast("Failed: " + err.message); }
};
async function checkNow() {
  S = await api("/api/check", {}); S.checking = true; render(); toast("Checking now…"); setTimeout(poll, 800);
}

/* ---------- live updates ---------- */
let pollTimer;
async function poll() {
  clearTimeout(pollTimer);
  try {
    S = await api("/api/state");
    clockSkew = Date.now() / 1000 - S.now;
    render();
  } catch { /* server restarting; try again */ }
  pollTimer = setTimeout(poll, S?.checking ? 1500 : 4000);
}
setInterval(() => { if (S) renderStatus(); }, 1000);  // countdown + "x ago"
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });

(async () => {
  T = await api("/api/terminals");
  await poll();
  if (!S.sailings.length && !S.last_check) $("settings").classList.add("open");
})();
</script>
</body>
</html>

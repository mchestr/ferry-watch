<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Get an alert the moment a reservation opens up." />
    <meta name="theme-color" content="#0b4f94" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Add to Home Screen: Android and desktop read the manifest, iOS reads the apple-* tags. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Waitlist" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Waitlist</title>
    <script>
      // Apply the theme before first paint, so dark mode doesn't flash light. Keep in step with
      // applyTheme() in src/lib/theme.ts.
      (function () {
        var dark = false;
        try {
          var stored = localStorage.getItem("theme");
          dark = stored === "dark" || (stored !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        } catch (e) {
          dark = window.matchMedia ? matchMedia("(prefers-color-scheme: dark)").matches : false;
        }
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

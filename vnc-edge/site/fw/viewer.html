<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-visual"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Ferry Watch checkout</title>
    <link rel="stylesheet" href="/fw/viewer.css" />
    <script src="/fw/session.js"></script>
    <script type="module" src="/fw/viewer/main.js"></script>
  </head>
  <body>
    <main id="stage">
      <canvas id="screen" role="img" aria-label="The checkout page"></canvas>
      <div id="gestures"></div>
      <div id="overlays"></div>
    </main>
    <input
      id="proxy"
      type="text"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      tabindex="-1"
      aria-label="Type into the checkout"
    />

    <button id="type-chip" class="chip" type="button" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="2.5" y="6" width="19" height="12" rx="2.5" />
        <path d="M6.5 10h1M10 10h1M13.5 10h1M17 10h.5M7.5 14h9" />
      </svg>
      Tap to type
    </button>

    <p id="notice" class="notice" role="status" hidden></p>

    <button id="menu-handle" type="button" aria-label="Checkout menu" aria-haspopup="dialog" aria-controls="menu">
      <span class="grip" aria-hidden="true"></span>
      <span id="menu-badge" class="badge" hidden></span>
    </button>

    <section id="menu" class="sheet" role="dialog" aria-modal="true" aria-labelledby="menu-title" hidden>
      <div class="scrim" data-close></div>
      <div class="panel">
        <header class="panel-head">
          <div>
            <h2 id="menu-title">Checkout</h2>
            <p id="menu-clock" class="clock" aria-live="off"></p>
          </div>
          <button class="close" type="button" aria-label="Close" data-close>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </header>
        <p id="menu-deadline" class="muted"></p>
        <div id="menu-pages-section" hidden>
          <h3>Open pages</h3>
          <ul id="menu-pages" class="pages"></ul>
        </div>
        <div class="actions">
          <button id="menu-paste" class="action" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="6" y="4" width="12" height="17" rx="2" />
              <path d="M9 4.5V3.5h6v1M9 10h6M9 14h4" />
            </svg>
            <span>Paste into the checkout</span>
          </button>
          <p id="menu-paste-note" class="note" hidden>Couldn't read the clipboard.</p>
          <button id="menu-classic" class="action" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="4.5" width="18" height="12" rx="2" />
              <path d="M8.5 20h7M12 16.5V20" />
            </svg>
            <span>Use the classic viewer</span>
          </button>
          <a id="menu-back" class="action" href="__FW_APP_ORIGIN__/">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6l-6 6 6 6" /></svg>
            <span>Back to Ferry Watch</span>
          </a>
        </div>
        <p class="beta">New checkout viewer (beta)</p>
      </div>
    </section>

    <template id="page-row">
      <li class="page">
        <button class="page-show" type="button">
          <span class="page-title"></span>
          <span class="page-origin"></span>
        </button>
        <button class="page-close" type="button" aria-label="Close this page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17" /></svg>
        </button>
      </li>
    </template>

    <section id="options" class="sheet" role="dialog" aria-modal="true" aria-labelledby="options-title" hidden>
      <div class="scrim" data-close></div>
      <div class="panel">
        <header class="panel-head">
          <h2 id="options-title">Choose an option</h2>
          <button class="close" type="button" aria-label="Close" data-close>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </header>
        <ul id="options-list" class="options" role="listbox" aria-labelledby="options-title"></ul>
        <div id="options-more" class="note" hidden>
          <p>This list is too long to show here. The classic viewer shows all of it.</p>
          <button id="options-classic" class="secondary" type="button">Use the classic viewer</button>
        </div>
      </div>
    </section>

    <template id="option-row">
      <li>
        <button class="option" type="button" role="option">
          <span class="option-label"></span>
          <svg class="tick" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
        </button>
      </li>
    </template>

    <!-- A JavaScript dialog of the checkout's page: it looks like the page's, never like Ferry Watch's own. -->
    <section id="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dialog-origin" hidden>
      <form id="dialog-box" method="dialog">
        <h2 id="dialog-origin"></h2>
        <p id="dialog-message"></p>
        <input
          id="dialog-input"
          type="text"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          aria-labelledby="dialog-message"
          hidden
        />
        <div class="dialog-buttons">
          <button id="dialog-cancel" type="button">Cancel</button>
          <button id="dialog-ok" type="submit">OK</button>
        </div>
      </form>
    </section>

    <section id="status" role="status">
      <div class="card">
        <div id="status-spinner" class="spinner" aria-hidden="true"></div>
        <h1 id="status-title">Opening your checkout…</h1>
        <p id="status-text" hidden></p>
        <button id="status-here" class="primary" type="button" hidden>Show it here</button>
        <button id="status-classic" class="secondary" type="button" hidden>Use the classic viewer</button>
        <a id="status-back" href="__FW_APP_ORIGIN__/" hidden>Back to Ferry Watch</a>
      </div>
    </section>

    <div id="fw-escape" role="alert" hidden>
      <p>Checkout not showing?</p>
      <button id="fw-escape-classic" type="button">Use the classic viewer</button>
    </div>
  </body>
</html>

<!doctype html><html><head><meta charset="utf-8"><title>Bomb</title></head>
<body><script>
// A page that tries to flood whatever reads it (DESIGN §5.3, C39): a select of 200 options with huge labels, `n`
// inputs piled on top of each other with a huge autocomplete, and a huge title. Sizes from the query string.
const p = new URLSearchParams(location.search);
const label = "x".repeat(Number(p.get("label") || 10));
const s = document.createElement("select");
s.style.cssText = "position:absolute;left:10px;top:60px;width:300px;height:40px";
for (let i = 0; i < 200; i++) { const o = document.createElement("option"); o.label = label; o.textContent = "o"; s.append(o); }
document.body.append(s);
const ac = "cc-number ".repeat(Number(p.get("ac") || 1));
const n = Number(p.get("n") || 10);
const box = document.createElement("div");
for (let i = 0; i < n; i++) {
  const e = document.createElement("input");
  e.style.cssText = "position:absolute;left:10px;top:10px;width:300px;height:30px";
  e.setAttribute("autocomplete", ac);
  box.append(e);
}
document.body.append(box);
document.title = "T".repeat(Number(p.get("title") || 5));
</script></body></html>

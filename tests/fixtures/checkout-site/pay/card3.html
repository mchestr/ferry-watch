<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;padding:8px;font-family:system-ui;background:#fff0f0}input,select{font-size:16px;padding:6px;width:100%;box-sizing:border-box;margin:2px 0}</style></head>
<body><label>Card number <input id="cc" autocomplete="cc-number" inputmode="numeric"></label>
<label>Month <select id="expm" autocomplete="cc-exp-month"><option value="" disabled selected>MM</option><option>01</option><option>02</option><option>03</option><option>04</option><option>05</option><option>06</option><option>07</option></select></label>
<div style="height:40px"></div>
<label>Year <select id="expy" autocomplete="cc-exp-year"><option value="">YYYY</option><option>2026</option><option>2027</option><option>2028</option></select></label>
<script>window.__ev=[];for(const id of ['expm','expy']){const el=document.getElementById(id);for(const t of ['input','change'])el.addEventListener(t,e=>__ev.push([id,t,e.isTrusted,el.value]));}</script>
</body></html>
